name: terraform

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "50 22 * * 1-5"
  workflow_dispatch:
    inputs:
      production:
        description: Also apply to production (needs approval)
        type: boolean
        default: false

permissions:
  contents: read

env:
  SIMULATE: ${{ vars.LIVE_DEPLOYS != 'true' }}
  TF_IN_AUTOMATION: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.6
      - name: Format and validate
        run: |
          source .github/simulate.sh
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate

  apply-staging:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.6
      - name: Plan and apply
        run: |
          source .github/simulate.sh
          terraform init -input=false -backend-config="key=staging/terraform.tfstate"
          terraform plan -input=false -var-file=environments/staging.tfvars -out=tfplan
          terraform apply -input=false tfplan

  apply-production:
    if: github.event_name == 'workflow_dispatch' && inputs.production
    needs: apply-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.6
      - name: Plan and apply
        run: |
          source .github/simulate.sh
          terraform init -input=false -backend-config="key=production/terraform.tfstate"
          terraform plan -input=false -var-file=environments/production.tfvars -out=tfplan
          terraform apply -input=false tfplan
